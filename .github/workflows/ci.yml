name: CI

on:
  push:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and package backend
        working-directory: backend
        run: bash ./gradlew check bootJar --no-daemon

      - name: Build backend Docker image
        run: docker build -t tradediary-backend:ci ./backend

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Build frontend Docker image
        run: docker build -t tradediary-frontend:ci ./frontend

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-server/requirements-test.txt

      - name: Test AI server routes
        working-directory: ai-server
        run: |
          python -m pip install -r requirements-test.txt
          python -m pytest tests -q
