name: Deploy to Oracle Cloud

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    concurrency:
      group: oracle-${{ github.event.inputs.environment || 'production' }}
      cancel-in-progress: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Test and build backend
      run: |
        cd backend
        chmod +x gradlew
        ./gradlew test migrationTest bootJar --no-daemon

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Test and build frontend
      run: |
        cd frontend
        npm ci
        npm run lint
        npm test
        npm run build

    - name: Verify frontend Docker image
      run: docker build -t tradediary-frontend:ci ./frontend

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: ai-server/requirements-test.txt

    - name: Test AI server HTTP routes
      run: |
        python -m pip install -r ai-server/requirements-test.txt
        cd ai-server
        python -m pytest tests -q

    - name: Build Docker Image
      run: |
        cd backend
        docker build -t ${{ secrets.DOCKER_REGISTRY }}/tradediary:${{ github.sha }} .
        docker tag ${{ secrets.DOCKER_REGISTRY }}/tradediary:${{ github.sha }} ${{ secrets.DOCKER_REGISTRY }}/tradediary:latest

    - name: Push to Docker Registry
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login ${{ secrets.DOCKER_REGISTRY }} -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
        docker push ${{ secrets.DOCKER_REGISTRY }}/tradediary:${{ github.sha }}
        docker push ${{ secrets.DOCKER_REGISTRY }}/tradediary:latest

    - name: Deploy to Oracle Cloud
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.ORACLE_HOST }}
        username: ${{ secrets.ORACLE_USER }}
        key: ${{ secrets.ORACLE_SSH_KEY }}
        script: |
          # Docker 컴포즈 파일 업데이트
          cat > /opt/tradediary/docker-compose.prod.yml << EOF
          version: '3.8'
          services:
            app:
              image: ${{ secrets.DOCKER_REGISTRY }}/tradediary:${{ github.sha }}
              ports:
                - "8080:8080"
              environment:
                - SPRING_PROFILES_ACTIVE=prod
                - DB_HOST=${{ secrets.DB_HOST }}
                - DB_PORT=${{ secrets.DB_PORT }}
                - DB_NAME=${{ secrets.DB_NAME || 'tradediary' }}
                - DB_USERNAME=${{ secrets.DB_USERNAME }}
                - DB_PASSWORD=${{ secrets.DB_PASSWORD }}
                - JWT_SECRET=${{ secrets.JWT_SECRET }}
                - AES_SECRET=${{ secrets.AES_SECRET }}
                - GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
                - GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
                - KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
                - KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}
                - DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
                - FRONTEND_URL=${{ secrets.FRONTEND_URL }}
                - OAUTH2_BASE_URL=${{ secrets.FRONTEND_URL }}
                - AI_SERVER_URL=${{ secrets.AI_SERVER_URL }}
                - AI_SERVER_API_KEY=${{ secrets.AI_SERVER_API_KEY }}
              restart: unless-stopped
          EOF

          # 새 이미지를 받은 뒤 백엔드 컨테이너만 교체
          cd /opt/tradediary
          docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.prod.yml pull app
          docker compose -f docker-compose.prod.yml up -d --no-deps app

          # Flyway 적용 및 DB 연결을 포함한 컨테이너 헬스체크 대기
          for attempt in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' $(docker compose -f docker-compose.prod.yml ps -q app) 2>/dev/null || true)
            if [ "$STATUS" = "healthy" ]; then
              echo "Backend deployment is healthy"
              break
            fi
            if [ "$STATUS" = "unhealthy" ] || [ "$attempt" = "30" ]; then
              docker compose -f docker-compose.prod.yml logs --tail=200 app
              echo "Backend health check failed: $STATUS"
              exit 1
            fi
            sleep 5
          done

          # 정리
          docker image prune -f
