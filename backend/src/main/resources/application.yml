spring:
  data:
    web:
      pageable:
        max-page-size: 100
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "${OAUTH2_BASE_URL:http://localhost:8080}/login/oauth2/code/kakao"
            scope:
              - profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:tradediary}
    username: ${DB_USERNAME:tradediary}
    password: ${DB_PASSWORD:tradediary}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/current
    baseline-on-migrate: true
    baseline-version: 100
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: 8080
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 7200000      # 2 hours; refreshed while the site remains open
  refresh-token-expiration: 2592000000  # 30 days; rotated on every successful refresh

ai-server:
  url: ${AI_SERVER_URL:http://localhost:8000/api}
  api-key: ${AI_SERVER_API_KEY:}

# 프론트엔드 URL (OAuth2 로그인 후 리다이렉트용)
frontend:
  url: ${FRONTEND_URL:https://tradediary.site}

# 거래소 API Key 암호화 키 (AES-256, 반드시 32자)
aes:
  secret: ${AES_SECRET}

# CryptoCompare 뉴스 API 키 (https://www.cryptocompare.com/cryptopian/api-keys)
cryptocompare:
  api-key: ${CRYPTOCOMPARE_API_KEY:}

# Groq API 키 (https://console.groq.com)
groq:
  api-key: ${GROQ_API_KEY:}

# DeepSeek API 키 (https://platform.deepseek.com)
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}

bybit:
  base-url: ${BYBIT_BASE_URL:https://api.bybit.com}

trade-sync:
  scheduler:
    initial-delay-ms: ${TRADE_SYNC_INITIAL_DELAY_MS:30000}
    interval-ms: ${TRADE_SYNC_INTERVAL_MS:60000}
