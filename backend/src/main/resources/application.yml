spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tradediary}
    username: ${DB_USERNAME:tradediary}
    password: ${DB_PASSWORD:tradediary}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000      # 30분 (ms)
  refresh-token-expiration: 604800000   # 7일 (ms)

ai-server:
  url: ${AI_SERVER_URL:http://localhost:8000}

# 거래소 API Key 암호화 키 (AES-256, 반드시 32자)
aes:
  secret: ${AES_SECRET}
