# [파일 용도] 로컬 개발 환경 Docker 컨테이너 설정

services:
  postgres:
    image: postgres:16
    container_name: tradediary-postgres
    environment:
      POSTGRES_DB: tradediary
      POSTGRES_USER: tradediary
      POSTGRES_PASSWORD: tradediary
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped

volumes:
  postgres-data:
