# [파일 용도] 전체 서비스 Docker 컨테이너 설정 (DB + 백엔드 + 프론트엔드)

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: tradediary-postgres
    environment:
      POSTGRES_DB: tradediary
      POSTGRES_USER: tradediary
      POSTGRES_PASSWORD: tradediary
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradediary"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Spring Boot 백엔드 ────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: tradediary-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: tradediary
      DB_USERNAME: tradediary
      DB_PASSWORD: tradediary
      JWT_SECRET: ${JWT_SECRET}
      AES_SECRET: ${AES_SECRET}
      AI_SERVER_URL: http://ai-server:8000
      TZ: Asia/Seoul
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── React 프론트엔드 (nginx) ────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: tradediary-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
